<!DOCTYPE html>
<html>
  <head>
    <title>Testing stream isolation</title>
    <meta charset="utf8"/>
    <link id="favicon" rel="shortcut icon" type="image/png" href="" />
  </head>
  <body>
    <iframe src='' id='iframe' style="width:100%; height:500px;"></iframe>
    <script src="./runtime-config.js"></script>
    <script>
     const runtimeConfig = window.RUNTIME_CONFIG || {};
     const testPagesRoot3 = runtimeConfig.TEST_PAGES_ROOT_3 || 'https://test-pages.privacytests3.org';
     const sessionId = Math.random().toString().substr(2);
     const favicon = document.getElementById("favicon");
     favicon.setAttribute("href", `${testPagesRoot3}/live/resource?type=favicon&key=${sessionId}`);
     const iframe = document.getElementById("iframe");
     iframe.setAttribute("src", `${testPagesRoot3}/stream-isolation-inner.html?sessionId=${sessionId}`);
    </script>
  </body>
</html>
